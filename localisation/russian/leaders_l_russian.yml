 ### SOV
 
 SOV_wolf_karpovsky: "Вольф Карповский"
 SOV_alice_rosenbaum: "Алиса Розенбаум"
 SOV_alice_rosenbaum_desc: "В политическом поле современной Российской Империи, где традиционные силы ведут вялую борьбу, имя Алисы Розенбаум заставляет многих нервничать. Её принципиальность и решительность считаются опасными для неповоротливой системы. Одни видят в ней истинную защитницу России, другие — опасную, в своем роде революционную силу.\n\nРодившись в 1905 году в Санкт-Петербурге в семье аптекаря, Алиса с юности стремилась к знаниям, объясняющим мир. Окончив историко-филологический факультет, она отказалась от академической карьеры, выбрав работу сценариста, журналиста и переводчика. Её краткий переход в политику в 1945 году, когда она была избрана депутатом-кадетом от Псковской губернии, закончился разочарованием. Увидев в партии лишь болото вечных склок и компромиссов, Розенбаум отказалась от мандата.\nВ последующие годы она ушла из политики и погрузилачь в изучение философии и экономики, где увлеклась Австрийской экономической школой. Поездка в Германию в 1953 году, где она слушала лекции известных мыслителей, стала для неё откровением. Своими идеями она стала делиться в колонках и статьях, и фамилия Розенбаум вновь зазвучала в интеллектуальных кругах.\n\nТеперь судьба делает неожиданный поворот. Бесцветная «Партия реформ», задыхающаяся в тени колоссов — октябристов и кадетов, находится на грани роспуска. Её старый лидер безнадёжно проигрывает в попытках придать ей хоть какой-то вес. В этих обстоятельствах имя Алисы Розенбаум, известного борца за свободу, может дать партии новую жизнь."
